<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Sovrana">
  <defs>
    <linearGradient id="sv" x1="10" y1="8" x2="90" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7EAD0"/>
      <stop offset=".42" stop-color="#E0B47A"/>
      <stop offset=".74" stop-color="#C873D9"/>
      <stop offset="1" stop-color="#7484FF"/>
